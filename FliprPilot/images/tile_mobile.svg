  <rect x="206" y="362" width="150" height="40" rx="8" fill="rgba(251,146,60,0.18)" stroke="rgba(251,146,60,0.3)" stroke-width="1"/>
  <text x="281" y="387" font-size="13" fill="#fb923c" font-weight="600" text-anchor="middle">&#9654; ON</text>
  <rect x="206" y="410" width="150" height="40" rx="8" fill="rgba(241,98,98,0.15)" stroke="rgba(241,98,98,0.25)" stroke-width="1"/>
  <text x="281" y="435" font-size="13" fill="#f87171" font-weight="600" text-anchor="middle">&#9632; OFF</text>
  <rect x="206" y="458" width="150" height="40" rx="8" fill="rgba(251,146,60,0.1)" stroke="rgba(251,146,60,0.2)" stroke-width="1"/>
  <text x="281" y="483" font-size="12" fill="#fdba74" font-weight="600" text-anchor="middle">&#9201; Forcer&#8230;</text>

