  <text x="93" y="218" font-size="12" fill="#94a3b8">mg/L</text>
  <text x="140" y="216" font-size="14" fill="#38bdf8">&#8595;</text>

  <rect x="196" y="168" width="170" height="82" rx="10" fill="#122236" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="196" y="168" width="170" height="3" rx="1.5" fill="url(#gm-neutral)"/>
  <text x="206" y="185" font-size="9" fill="#5a8aaa" font-weight="600" letter-spacing="0.6">&#9889; REDOX</text>
