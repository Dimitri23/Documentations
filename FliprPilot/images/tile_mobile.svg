  <rect x="192" y="578" width="156" height="40" rx="8" fill="rgba(241,98,98,0.1)" stroke="rgba(241,98,98,0.2)" stroke-width="1"/>
  <text x="270" y="603" font-size="13" fill="#f87171" font-weight="600" text-anchor="middle">&#10005; D&#233;sactiver</text>

